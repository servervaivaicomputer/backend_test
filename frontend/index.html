<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface-hover: #1e1e1e;
      --accent: #c8ff00;
      --accent-dim: #a3cc00;
      --text-primary: #f0ece4;
      --text-muted: #6b6560;
      --danger: #ff3b3b;
      --border: #2a2a2a;
      --radius: 12px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Mono', monospace;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 15% 80%, rgba(200, 255, 0, 0.03) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 20%, rgba(200, 255, 0, 0.02) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    /* ---- Nav ---- */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      border-bottom: 1px solid var(--border);
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .logo:hover {
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .nav-link {
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--text-muted);
      text-decoration: none;
      padding: 8px 18px;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      background: none;
      transition: all 0.25s ease;
      letter-spacing: 0.02em;
    }

    .nav-link:hover {
      color: var(--text-primary);
      border-color: var(--border);
      background: var(--surface);
    }

    .nav-link.active {
      color: var(--bg);
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 500;
    }

    #btn-logout {
      color: var(--danger);
      border-color: transparent;
    }

    #btn-logout:hover {
      background: rgba(255, 59, 59, 0.1);
      border-color: rgba(255, 59, 59, 0.3);
      color: var(--danger);
    }

    /* ---- Main ---- */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      position: relative;
      z-index: 1;
    }

    /* ---- Login Card ---- */
    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px 40px;
      animation: fadeUp 0.5s ease forwards;
    }

    .login-card h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1.8rem;
      margin-bottom: 6px;
      letter-spacing: -0.03em;
    }

    .login-card p.sub {
      color: var(--text-muted);
      font-size: 0.78rem;
      margin-bottom: 36px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      font-family: 'DM Mono', monospace;
      font-size: 0.88rem;
      color: var(--text-primary);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.25s ease;
    }

    .form-group input:focus {
      border-color: var(--accent);
    }

    .form-group input::placeholder {
      color: var(--text-muted);
      opacity: 0.5;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--bg);
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.25s ease;
      letter-spacing: 0.02em;
      margin-top: 8px;
    }

    .btn-primary:hover {
      background: var(--accent-dim);
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .error-msg {
      color: var(--danger);
      font-size: 0.78rem;
      margin-top: 16px;
      min-height: 1.2em;
      text-align: center;
    }

    /* ---- Protected Page Container ---- */
    .page-container {
      width: 100%;
      max-width: 960px;
      animation: fadeUp 0.4s ease forwards;
    }

    .page-container .page-header {
      margin-bottom: 32px;
    }

    .page-container .page-header h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 2rem;
      letter-spacing: -0.03em;
    }

    .page-container .page-header .tag {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--accent);
      background: rgba(200, 255, 0, 0.08);
      border: 1px solid rgba(200, 255, 0, 0.15);
      padding: 4px 12px;
      border-radius: 20px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .page-content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px;
      line-height: 1.7;
      font-size: 0.9rem;
      color: var(--text-primary);
      min-height: 200px;
    }

    /* ---- Loading Spinner ---- */
    .loader-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .spinner-label {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* ---- Animations ---- */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ---- Responsive ---- */
    @media (max-width: 600px) {
      nav {
        padding: 16px 20px;
      }
      .login-card {
        padding: 36px 24px;
      }
      .page-content {
        padding: 24px;
      }
    }
  </style>
</head>
<body>

  <!-- Nav -->
  <nav id="navbar">
    <div class="logo" onclick="navigate('/')">myapp</div>
    <div class="nav-links" id="nav-links"></div>
  </nav>

  <!-- Page Mount -->
  <main id="app"></main>

  <script>
    // ========================================
    // CONFIG
    // ========================================
    const BACKEND = 'https://your-backend.onrender.com'; // <-- Change this

    // ========================================
    // STATE
    // ========================================
    let isLoggedIn = false;
    let currentRoute = '/';

    // ========================================
    // ROUTER
    // ========================================
    const routes = {
      '/login': renderLogin,
      '/cloud': renderProtected,
      '/workplace': renderProtected,
      '/': renderHome,
    };

    function navigate(path) {
      history.pushState(null, '', path);
      handleRoute();
    }

    window.addEventListener('popstate', handleRoute);

    async function handleRoute() {
      const path = window.location.pathname;
      currentRoute = path;

      // Check auth first
      await checkAuth();

      const protectedRoutes = ['/cloud', '/workplace'];

      if (protectedRoutes.includes(path) && !isLoggedIn) {
        navigate('/login');
        return;
      }

      if (path === '/login' && isLoggedIn) {
        navigate('/cloud');
        return;
      }

      const handler = routes[path] || renderNotFound;
      handler(path);
      updateNav();
    }

    // ========================================
    // AUTH
    // ========================================
    async function checkAuth() {
      try {
        const res = await fetch(`${BACKEND}/check-auth`, {
          method: 'GET',
          credentials: 'include'
        });
        isLoggedIn = res.ok;
      } catch {
        isLoggedIn = false;
      }
    }

    async function doLogin(username, password) {
      const res = await fetch(`${BACKEND}/login`, {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (data.success) {
        isLoggedIn = true;
        navigate('/cloud');
      }
      return data;
    }

    async function doLogout() {
      await fetch(`${BACKEND}/logout`, {
        method: 'POST',
        credentials: 'include'
      });
      isLoggedIn = false;
      navigate('/login');
    }

    // ========================================
    // NAV
    // ========================================
    function updateNav() {
      const linksEl = document.getElementById('nav-links');

      if (isLoggedIn) {
        linksEl.innerHTML = `
          <button class="nav-link ${currentRoute === '/cloud' ? 'active' : ''}"
                  onclick="navigate('/cloud')">/cloud</button>
          <button class="nav-link ${currentRoute === '/workplace' ? 'active' : ''}"
                  onclick="navigate('/workplace')">/workplace</button>
          <button class="nav-link" id="btn-logout"
                  onclick="doLogout()">logout</button>
        `;
      } else {
        linksEl.innerHTML = `
          <button class="nav-link ${currentRoute === '/login' ? 'active' : ''}"
                  onclick="navigate('/login')">/login</button>
        `;
      }
    }

    // ========================================
    // PAGES
    // ========================================
    function renderHome() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="login-card" style="text-align:center;">
          <h1 style="margin-bottom:12px;">welcome</h1>
          <p class="sub" style="margin-bottom:28px;">sign in to access your workspace</p>
          <button class="btn-primary" onclick="navigate('/login')">go to login</button>
        </div>
      `;
    }

    function renderLogin() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="login-card">
          <h1>sign in</h1>
          <p class="sub">enter your credentials to continue</p>
          <form id="login-form" autocomplete="off">
            <div class="form-group">
              <label for="username">username</label>
              <input type="text" id="username" placeholder="admin" required autofocus>
            </div>
            <div class="form-group">
              <label for="password">password</label>
              <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary" id="login-btn">sign in</button>
            <div class="error-msg" id="login-error"></div>
          </form>
        </div>
      `;

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('login-btn');
        const errEl = document.getElementById('login-error');
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        btn.disabled = true;
        btn.textContent = 'signing in...';
        errEl.textContent = '';

        try {
          const result = await doLogin(username, password);
          if (!result.success) {
            errEl.textContent = result.message || 'Invalid credentials';
          }
        } catch {
          errEl.textContent = 'Connection failed. Try again.';
        }

        btn.disabled = false;
        btn.textContent = 'sign in';
      });
    }

    async function renderProtected(route) {
      const app = document.getElementById('app');
      const pageName = route.replace('/', '');

      // Loading state
      app.innerHTML = `
        <div class="page-container">
          <div class="loader-wrap" style="padding-top:80px;">
            <div class="spinner"></div>
            <div class="spinner-label">loading /${pageName}...</div>
          </div>
        </div>
      `;

      try {
        const res = await fetch(`${BACKEND}/page/${pageName}`, {
          method: 'GET',
          credentials: 'include'
        });

        if (res.status === 401) {
          isLoggedIn = false;
          navigate('/login');
          return;
        }

        if (!res.ok) {
          renderNotFound();
          return;
        }

        const html = await res.text();

        app.innerHTML = `
          <div class="page-container">
            <div class="page-header">
              <h1>/${pageName}</h1>
              <span class="tag">protected</span>
            </div>
            <div class="page-content">${html}</div>
          </div>
        `;
      } catch {
        app.innerHTML = `
          <div class="page-container">
            <div class="page-content" style="text-align:center;">
              <p style="color:var(--danger);margin-bottom:12px;">Failed to load /${pageName}</p>
              <p style="color:var(--text-muted);font-size:0.8rem;">Backend might be unreachable</p>
              <button class="btn-primary" style="max-width:200px;margin-top:24px;"
                      onclick="navigate('${route}')">retry</button>
            </div>
          </div>
        `;
      }
    }

    function renderNotFound() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="login-card" style="text-align:center;">
          <h1 style="font-size:3rem;margin-bottom:8px;">404</h1>
          <p class="sub" style="margin-bottom:28px;">page not found</p>
          <button class="btn-primary" onclick="navigate('/')">go home</button>
        </div>
      `;
    }

    // ========================================
    // INIT
    // ========================================
    handleRoute();
  </script>
</body>
</html>
