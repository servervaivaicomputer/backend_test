<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: #2a2a3a;
      --accent: #6c63ff;
      --accent-glow: rgba(108, 99, 255, 0.15);
      --text: #e8e6f0;
      --text-muted: #6b6880;
      --danger: #ff4757;
      --success: #2ed573;
      --radius: 12px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
      z-index: 9999;
    }

    /* ── NAVBAR ─────────────────────────── */
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      height: 64px;
      background: rgba(18, 18, 26, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 32px;
      z-index: 100;
    }

    nav .brand {
      font-family: 'Syne', sans-serif;
      font-weight: 800; font-size: 1.15rem;
      letter-spacing: -0.02em;
    }

    nav .nav-links { display: flex; gap: 6px; }

    nav .nav-links a {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    nav .nav-links a:hover,
    nav .nav-links a.active {
      color: var(--text);
      background: var(--accent-glow);
    }

    nav .user-section { display: flex; align-items: center; gap: 14px; }

    nav .user-section span {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .btn-logout {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      padding: 6px 14px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-logout:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    /* ── MAIN CONTENT ───────────────────── */
    main {
      padding: 96px 32px 48px;
      max-width: 1100px;
      margin: 0 auto;
      min-height: 100vh;
    }

    /* ── LOGIN PAGE ─────────────────────── */
    .login-wrap {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
    }

    .login-box {
      width: 100%; max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px 40px;
      animation: fadeUp 0.5s ease;
    }

    .login-box h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 700; font-size: 1.8rem;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }

    .login-box .subtitle {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 36px;
    }

    .field { margin-bottom: 20px; }

    .field label {
      display: block;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .field input {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .field input:focus { border-color: var(--accent); }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #fff;
      border: none; border-radius: 8px;
      font-family: 'Syne', sans-serif;
      font-weight: 600; font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 8px;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 32px var(--accent-glow);
    }

    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .msg-error {
      color: var(--danger);
      font-size: 0.78rem;
      margin-top: 14px;
      display: none;
    }

    .msg-error.show { display: block; animation: fadeUp 0.3s ease; }

    /* ── PAGE CONTENT (from backend) ────── */
    .page-header { margin-bottom: 48px; animation: fadeUp 0.5s ease; }

    .page-header h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 700; font-size: 2.2rem;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }

    .page-header p { color: var(--text-muted); font-size: 0.88rem; }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      transition: all 0.3s ease;
      opacity: 0;
      animation: fadeUp 0.5s ease forwards;
    }

    .card:nth-child(1) { animation-delay: 0.08s; }
    .card:nth-child(2) { animation-delay: 0.16s; }
    .card:nth-child(3) { animation-delay: 0.24s; }
    .card:nth-child(4) { animation-delay: 0.32s; }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    .card-icon { font-size: 1.8rem; margin-bottom: 14px; }

    .card h3 {
      font-family: 'Syne', sans-serif;
      font-weight: 600; font-size: 1.05rem;
      margin-bottom: 8px;
    }

    .card p { color: var(--text-muted); font-size: 0.82rem; line-height: 1.6; }

    .status.online { color: var(--success); }

    /* ── LOADING ────────────────────────── */
    .loading {
      display: flex; align-items: center; justify-content: center;
      min-height: 60vh;
    }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    /* ── ANIMATIONS ─────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── RESPONSIVE ─────────────────────── */
    @media (max-width: 768px) {
      nav { padding: 0 16px; }
      main { padding: 88px 16px 32px; }
      .page-header h1 { font-size: 1.7rem; }
      .card-grid { grid-template-columns: 1fr; }
      nav .user-section span { display: none; }
    }
  </style>
</head>
<body>

  <nav id="navbar" style="display:none">
    <div class="brand">PrivatePortal</div>
    <div class="nav-links">
      <a href="/cloud" data-link="/cloud">Cloud</a>
      <a href="/workplace" data-link="/workplace">Workplace</a>
    </div>
    <div class="user-section">
      <span id="user-display"></span>
      <button class="btn-logout" id="btnLogout">Logout</button>
    </div>
  </nav>

  <main id="app"></main>

  <script>
    // ═══════════════════════════════════════
    //  CONFIGURATION
    //  Replace with your actual Render URL
    // ═══════════════════════════════════════
    const API = 'https://backend-test-1-oelt.onrender.com';

    // ── Auth helpers ──────────────────────
    const auth = {
      get token()  { return localStorage.getItem('token'); },
      get user()   { return localStorage.getItem('username'); },
      save(token, username) {
        localStorage.setItem('token', token);
        localStorage.setItem('username', username);
      },
      clear() {
        localStorage.removeItem('token');
        localStorage.removeItem('username');
      },
      loggedIn() { return !!this.token; }
    };

    // ── Router ────────────────────────────
    const pages = { '/login': showLogin, '/cloud': showPage, '/workplace': showPage };

    function navigate(path, push = true) {
      if (push) history.pushState({}, '', path);
      resolve(path);
    }

    function resolve(path) {
      if (!auth.loggedIn() && path !== '/login') return navigate('/login');
      if (auth.loggedIn() && path === '/login')  return navigate('/cloud');

      const handler = pages[path];
      if (handler) handler(path);
      else auth.loggedIn() ? navigate('/cloud') : navigate('/login');
    }

    // ── Login page ────────────────────────
    function showLogin() {
      document.getElementById('navbar').style.display = 'none';
      document.getElementById('app').style.paddingTop = '0';

      document.getElementById('app').innerHTML = `
        <div class="login-wrap">
          <div class="login-box">
            <h1>Welcome Back</h1>
            <p class="subtitle">Sign in to access your private pages.</p>
            <form id="loginForm">
              <div class="field">
                <label for="inpUser">Username</label>
                <input id="inpUser" type="text" placeholder="Enter username" required autocomplete="username">
              </div>
              <div class="field">
                <label for="inpPass">Password</label>
                <input id="inpPass" type="password" placeholder="Enter password" required autocomplete="current-password">
              </div>
              <button type="submit" class="btn-primary" id="btnSubmit">Sign In</button>
              <p class="msg-error" id="errMsg"></p>
            </form>
          </div>
        </div>`;

      document.getElementById('loginForm').addEventListener('submit', onLogin);
    }

    async function onLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      const err = document.getElementById('errMsg');
      const username = document.getElementById('inpUser').value.trim();
      const password = document.getElementById('inpPass').value;

      btn.disabled = true; btn.textContent = 'Signing in...'; err.classList.remove('show');

      try {
        const res  = await fetch(`${API}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          auth.save(data.token, data.username);
          navigate('/cloud');
        } else {
          err.textContent = data.error || 'Login failed.';
          err.classList.add('show');
        }
      } catch {
        err.textContent = 'Cannot connect to server.';
        err.classList.add('show');
      } finally {
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    }

    // ── Protected page loader ─────────────
    function showPage(path) {
      const name = path.replace('/', '');
      const navbar  = document.getElementById('navbar');
      const app     = document.getElementById('app');

      navbar.style.display = 'flex';
      app.style.paddingTop = '';

      // Active link
      document.querySelectorAll('.nav-links a').forEach(a =>
        a.classList.toggle('active', a.dataset.link === path));

      // Username
      document.getElementById('user-display').textContent = auth.user || '';

      // Loading
      app.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

      fetch(`${API}/${name}`, {
        headers: { 'Authorization': `Bearer ${auth.token}` }
      })
      .then(res => {
        if (res.status === 401) { auth.clear(); navigate('/login'); throw new Error('Unauthorized'); }
        if (!res.ok) throw new Error('Failed to load page.');
        return res.text();
      })
      .then(html => { app.innerHTML = html; })
      .catch(err => {
        if (err.message === 'Unauthorized') return;
        app.innerHTML = `
          <div class="login-wrap">
            <div class="login-box" style="text-align:center">
              <h1 style="margin-bottom:12px">Error</h1>
              <p class="subtitle">${err.message}</p>
              <button class="btn-primary" onclick="navigate('/cloud')" style="margin-top:20px">Retry</button>
            </div>
          </div>`;
      });
    }

    // ── Logout ────────────────────────────
    document.getElementById('btnLogout').addEventListener('click', () => {
      auth.clear();
      navigate('/login');
    });

    // ── Browser back / forward ────────────
    window.addEventListener('popstate', () => resolve(location.pathname));

    // ── Intercept nav links ───────────────
    document.addEventListener('click', e => {
      const link = e.target.closest('a[data-link]');
      if (link) { e.preventDefault(); navigate(link.dataset.link); }
    });

    // ── Boot ──────────────────────────────
    resolve(location.pathname);
  </script>

</body>
</html>
